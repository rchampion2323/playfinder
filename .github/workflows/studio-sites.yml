# Builds and deploys sites in studio/sites/*.
#
#   push to main         → deploy changed sites to production (Azure and/or GitHub Pages)
#   pull request         → validate + deploy Azure sites to a preview URL (posted on the PR)
#   PR closed            → tear down those preview environments
#   Actions → Run        → deploy one site (or "all") on demand
#
# A site only deploys if its site.json "targets" includes "azure" or "github-pages".
# One-time setup: bash studio/infra/bootstrap.sh  (see studio/README.md)
name: Studio sites

on:
  push:
    branches: [main]
    paths:
      - "studio/sites/**"
      - "studio/infra/**"
      - "studio/scripts/**"
      - "studio/studio.config.json"
      - ".github/workflows/studio-sites.yml"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
    paths:
      - "studio/**"
      - ".github/workflows/studio-sites.yml"
  workflow_dispatch:
    inputs:
      site:
        description: "Site slug to deploy, or 'all'"
        required: true
        default: all

permissions:
  contents: read

concurrency:
  group: studio-sites-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Validate & plan
    runs-on: ubuntu-latest
    outputs:
      azure: ${{ steps.plan.outputs.azure }}
      has_azure: ${{ steps.plan.outputs.has_azure }}
      pages: ${{ steps.plan.outputs.pages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate sites
        if: github.event.action != 'closed'
        run: node studio/scripts/validate.mjs
      - name: Plan deployments
        id: plan
        env:
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
          INPUT_SITE: ${{ inputs.site }}
        run: node studio/scripts/ci-plan.mjs

  azure:
    name: Azure · ${{ matrix.slug }}
    needs: plan
    # Fork PRs can't reach your secrets, so skip them.
    if: >-
      needs.plan.outputs.has_azure == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # OIDC login to Azure — no stored passwords
      pull-requests: write  # preview URL comment
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.azure) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build
        if: github.event.action != 'closed'
        run: node studio/scripts/build.mjs "${{ matrix.slug }}"

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Provision Static Web App
        if: github.event.action != 'closed'
        run: |
          az deployment group create \
            --resource-group "${{ matrix.resourceGroup }}" \
            --name "site-${{ matrix.slug }}" \
            --template-file studio/infra/static-site.bicep \
            --parameters name="${{ matrix.name }}" location="${{ matrix.location }}" \
                         sku="${{ matrix.sku }}" slug="${{ matrix.slug }}" owner="${{ matrix.owner }}" \
            --output none

      - name: Fetch deployment token
        id: token
        run: |
          token=$(az staticwebapp secrets list -n "${{ matrix.name }}" -g "${{ matrix.resourceGroup }}" \
                    --query properties.apiKey -o tsv 2>/dev/null || true)
          if [ -n "$token" ]; then echo "::add-mask::$token"; fi
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Deploy
        id: deploy
        if: steps.token.outputs.token != ''
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.token.outputs.token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: ${{ github.event.action == 'closed' && 'close' || 'upload' }}
          app_location: studio/.out/${{ matrix.slug }}
          output_location: ""
          skip_app_build: true
          skip_api_build: true

      - name: Summary
        if: github.event.action != 'closed'
        run: |
          host=$(az staticwebapp show -n "${{ matrix.name }}" -g "${{ matrix.resourceGroup }}" --query defaultHostname -o tsv)
          {
            echo "### ${{ matrix.slug }}"
            echo "- Deployed: ${{ steps.deploy.outputs.static_web_app_url }}"
            echo "- Production URL: https://$host"
          } >> "$GITHUB_STEP_SUMMARY"

  pages:
    name: GitHub Pages
    needs: plan
    if: needs.plan.outputs.pages == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node studio/scripts/build.mjs --pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: studio/.out/_pages
      - id: deploy
        uses: actions/deploy-pages@v4
